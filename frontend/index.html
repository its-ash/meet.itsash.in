<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="description" content="Private peer-to-peer calls for two. No account. No download." />
<meta name="theme-color" content="#f4f3ee" />
<title>Meet</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meet" />
<link rel="stylesheet" href="/src/style.css" />
</head>
<body class="font-sans antialiased h-full">

<main id="view-landing" class="surface-light min-h-dvh w-full grid place-items-center px-5">
  <div class="w-full max-w-sm flex flex-col gap-3">
    <form id="form-join-room" class="code-field" novalidate>
      <label for="input-room-id" class="sr-only">4-character meeting code</label>
      <input id="input-room-id" name="roomId" type="text" inputmode="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"
        placeholder="Enter code"
        class="flex-1 min-w-0 bg-transparent text-ink placeholder:text-muted text-base px-5 uppercase tracking-[0.3em] placeholder:normal-case placeholder:tracking-normal" />
      <button type="submit" aria-label="Join meeting" class="shrink-0 px-6 text-sm font-medium border-l-[1.5px] border-ink hover:bg-ink hover:text-paper">Join</button>
    </form>
    <button id="btn-create-room" type="button" class="btn btn-primary text-base">New meeting</button>
    <p id="landing-error" class="text-sm text-danger text-center" role="alert" hidden></p>
    <a id="btn-install" class="btn btn-quiet text-sm" rel="noopener" hidden>
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>
      <span id="install-label">Install app</span>
    </a>
  </div>
</main>

<main id="view-ended" class="surface-light min-h-dvh w-full flex flex-col" hidden>
  <header class="flex items-center px-5 md:px-10 h-16 md:h-20 shrink-0">
    <a href="/" class="inline-flex items-center gap-2 text-lg font-semibold tracking-tight rounded-md" aria-label="Meet home"><span class="dot bg-ink"></span>meet</a>
  </header>
  <div class="flex-1 flex items-center justify-center px-5 pb-16">
    <div class="w-full max-w-md">
      <span class="grid place-items-center w-12 h-12 rounded-2xl bg-paper-2 border border-line mb-6" aria-hidden="true">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14.5c5-4.6 13-4.6 18 0l-2.4 2.6-3.4-1.4v-2.5a11 11 0 0 0-6.4 0v2.5l-3.4 1.4z"/></svg>
      </span>
      <h1 id="ended-title" class="text-2xl md:text-3xl font-semibold tracking-[-0.03em] mb-3">Session ended</h1>
      <p id="ended-message" class="text-ink-soft leading-relaxed mb-8">No one joined in time.</p>
      <a href="/" class="btn btn-primary text-base">
        <span>Back to home</span>
        <svg class="arrow w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>
</main>

<main id="view-full" class="surface-light min-h-dvh w-full flex flex-col" hidden>
  <header class="flex items-center px-5 md:px-10 h-16 md:h-20 shrink-0">
    <a href="/" class="inline-flex items-center gap-2 text-lg font-semibold tracking-tight rounded-md" aria-label="Meet home"><span class="dot bg-ink"></span>meet</a>
  </header>
  <div class="flex-1 flex items-center justify-center px-5 pb-16">
    <div class="w-full max-w-md">
      <span class="grid place-items-center w-12 h-12 rounded-2xl bg-paper-2 border border-line mb-6" aria-hidden="true">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.2 2.7-6 6-6s6 2.8 6 6"/><circle cx="17" cy="8" r="2.4"/><path d="M15.5 14.2c2.6.5 4.5 2.8 4.5 5.8"/></svg>
      </span>
      <h1 class="text-2xl md:text-3xl font-semibold tracking-[-0.03em] mb-3">This meeting is full</h1>
      <p class="text-ink-soft leading-relaxed mb-8">Two people are already in this call. Start your own meeting instead.</p>
      <button id="btn-new-from-full" type="button" class="btn btn-primary text-base">
        <span>New meeting</span>
        <svg class="arrow w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
</main>

<main id="view-call" class="surface-dark relative h-dvh w-full overflow-hidden bg-black" hidden>
  <div id="waiting-panel" class="absolute inset-0 grid place-items-center px-4 pb-32 pt-20" hidden>
    <div class="w-full max-w-md flex flex-col items-center gap-4">
      <p class="flex items-center gap-2 text-sm text-accent" role="status"><span class="dot bg-accent pulse-dot"></span>Waiting for your partner</p>
      <div class="w-full flex items-stretch rounded-2xl border border-stage-line bg-stage-2 p-1.5 gap-1.5">
        <code id="room-link" class="flex-1 min-w-0 self-center px-3 text-sm truncate select-all"></code>
        <button id="btn-copy-link" type="button" class="btn min-h-11 px-4 rounded-xl bg-accent text-ink text-sm font-semibold hover:bg-[#d6f78c]">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copy-label" aria-live="polite">Copy</span><span class="sr-only"> link</span>
        </button>
      </div>
    </div>
  </div>

  <div id="remote-tile" class="tile tile-full absolute inset-0" data-video="off">
    <video id="remote-video" autoplay muted playsinline></video>
    <audio id="remote-audio" autoplay hidden></audio>
    <div class="tile-empty" style="--avatar:clamp(6rem,26vmin,10rem)">
      <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.8 3.8-6.5 7.5-6.5s6.9 2.7 7.5 6.5"/></svg></span>
      <span class="text-base font-medium">Partner</span>
      <span class="-mt-2 text-xs text-fog">Camera off</span>
    </div>
  </div>

  <header class="overlay overlay-top absolute inset-x-0 top-0 z-30 flex items-center justify-between gap-3 px-3 md:px-6 pt-[max(0.75rem,env(safe-area-inset-top))] pb-8">
    <div class="flex items-center gap-3 min-w-0">
      <a href="/" class="hidden sm:inline-flex items-center gap-2 font-semibold tracking-tight rounded-md" aria-label="Meet home"><span class="dot bg-accent"></span>meet</a>
      <span class="chip"><span class="text-fog">Room</span><span id="call-room-code" class="uppercase tracking-[0.2em]"></span></span>
    </div>
    <div class="flex items-center gap-2 min-w-0">
      <span id="peer-status-badge" class="chip hidden md:inline-flex text-fog tabular-nums"></span>
      <div id="quality-indicator" class="chip" role="status" hidden>
        <span id="quality-dot" class="dot bg-warn" aria-hidden="true"></span>
        <span id="quality-label" class="tabular-nums">Measuring…</span>
      </div>
      <span id="call-timer" class="chip"><span class="dot bg-accent pulse-dot" aria-hidden="true"></span><span id="call-duration" class="tabular-nums" role="timer" aria-label="Call duration">00:00</span></span>
    </div>
  </header>

  <button id="btn-unmute-remote" type="button" class="chip absolute z-30 top-[calc(env(safe-area-inset-top)+4rem)] left-1/2 -translate-x-1/2" hidden>Tap to hear your partner</button>

  <div id="local-tile" class="tile tile-self absolute z-20 right-3 md:right-6 bottom-[calc(env(safe-area-inset-bottom)+6.5rem)] md:bottom-[calc(env(safe-area-inset-bottom)+7.5rem)] w-28 sm:w-44 md:w-60 aspect-[3/4] sm:aspect-video" data-video="off">
      <video id="local-video" class="-scale-x-100" autoplay muted playsinline></video>
      <div class="tile-empty" style="--avatar:clamp(2.75rem,8vw,4rem)">
        <span class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.8 3.8-6.5 7.5-6.5s6.9 2.7 7.5 6.5"/></svg></span>
      </div>
      <span class="tile-tag">You<span class="tile-share">· presenting</span><span class="tile-mute" aria-label="Microphone muted" role="img"><svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9v3a3 3 0 0 0 5.12 2.12M12.9 4.16A3 3 0 0 1 15 7v2M5 10a7 7 0 0 0 10.54 6.04M17.9 14.02A7 7 0 0 0 19 10M12 17v4M3 3l18 18"/></svg></span></span>
  </div>

  <div class="overlay overlay-bottom absolute inset-x-0 bottom-0 z-30 flex flex-col items-center px-3 pt-10 pb-[max(1rem,env(safe-area-inset-bottom))]">
    <div role="group" aria-label="Call controls" class="relative flex items-start justify-center gap-2 sm:gap-4">
      <button id="btn-toggle-mic" type="button" aria-label="Mute microphone" aria-pressed="false" class="ctl ctl-mic">
        <span class="ctl-icon">
          <svg id="icon-mic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8.5 21h7"/></svg>
          <svg id="icon-mic-off" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9v3a3 3 0 0 0 5.12 2.12M12.9 4.16A3 3 0 0 1 15 7v2M5 10a7 7 0 0 0 10.54 6.04M17.9 14.02A7 7 0 0 0 19 10M12 17v4M8.5 21h7M3 3l18 18"/></svg>
        </span>
        <span class="ctl-label" aria-hidden="true">Mic</span>
      </button>

      <button id="btn-toggle-camera" type="button" aria-label="Turn camera on" aria-pressed="false" class="ctl">
        <span class="ctl-icon">
          <svg id="icon-camera-on" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg>
          <svg id="icon-camera-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h4.5a2 2 0 0 1 2 2v4.5M15.5 16a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2M15.5 10.5l6-3.5v10l-4-2.3M3 3l18 18"/></svg>
        </span>
        <span class="ctl-label" aria-hidden="true">Camera</span>
      </button>

      <button id="btn-toggle-share" type="button" aria-label="Share your screen" aria-pressed="false" class="ctl">
        <span class="ctl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8 21h8M12 17v4M9 10.5l3-3 3 3M12 7.5v6"/></svg></span>
        <span class="ctl-label" aria-hidden="true">Share</span>
      </button>

      <button id="btn-toggle-pip" type="button" aria-label="Picture in picture" aria-pressed="false" class="ctl" hidden>
        <span class="ctl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16" rx="1.5"/><rect x="12" y="11.5" width="7" height="6" rx="0.5"/></svg></span>
        <span class="ctl-label" aria-hidden="true">PiP</span>
      </button>

      <button id="btn-toggle-devices" type="button" aria-label="Choose camera and microphone" aria-expanded="false" aria-controls="device-picker" class="ctl">
        <span class="ctl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>
        <span class="ctl-label" aria-hidden="true">Devices</span>
      </button>

      <div id="device-picker" role="group" aria-label="Devices" class="absolute bottom-full right-0 mb-3 w-[min(18rem,calc(100vw-1.5rem))] rounded-2xl bg-stage-2 border border-stage-line p-4 shadow-[0_24px_60px_-20px_rgb(0_0_0/0.8)] z-40" hidden>
        <label for="select-camera" class="block text-xs text-fog mb-1.5">Camera</label>
        <select id="select-camera" class="field-select mb-4"></select>
        <label for="select-microphone" class="block text-xs text-fog mb-1.5">Microphone</label>
        <select id="select-microphone" class="field-select"></select>
      </div>

      <button id="btn-end-call" type="button" aria-label="End call" class="ctl ctl-end ml-1 sm:ml-2">
        <span class="ctl-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14.5c5-4.6 13-4.6 18 0l-2.4 2.6-3.4-1.4v-2.5a11 11 0 0 0-6.4 0v2.5l-3.4 1.4z"/></svg></span>
        <span class="ctl-label" aria-hidden="true">Leave</span>
      </button>
    </div>
  </div>
</main>

<dialog id="perm-dialog" class="perm-dialog" aria-labelledby="perm-title" aria-describedby="perm-msg">
  <div class="flex flex-col items-center gap-4 text-center">
    <span class="grid place-items-center w-14 h-14 rounded-2xl bg-stage-3 border border-stage-line text-accent" aria-hidden="true">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5"/></svg>
    </span>
    <h2 id="perm-title" class="text-xl font-semibold tracking-tight">Allow camera and microphone</h2>
    <p id="perm-msg" class="text-sm text-fog leading-relaxed"></p>
    <button id="btn-perm-allow" type="button" class="btn w-full min-h-12 rounded-xl bg-accent text-ink font-semibold hover:bg-[#d6f78c]">Allow access</button>
    <button id="btn-perm-skip" type="button" class="text-sm text-fog hover:text-paper rounded-md px-2 py-1">Not now</button>
  </div>
</dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
