<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { height: 100%; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fade-in 200ms ease-out; }
</style>
  <script type="module" crossorigin src="/assets/index-Dk_6Rh-_.js"></script>
</head>
<body class="bg-black font-sans antialiased h-full">

<!-- ============================================================ -->
<!-- LANDING VIEW — create or join a room                          -->
<!-- ============================================================ -->
<main id="view-landing" class="relative h-screen w-full overflow-hidden bg-black flex items-center justify-center px-4">
  <div class="absolute inset-0 z-0" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-black"></div>
    <div class="absolute top-0 left-0 w-96 h-96 bg-indigo-500/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-sm text-center">
    <img src="/icon.svg" alt="" class="w-12 h-12 mx-auto mb-6" aria-hidden="true" />
    <h1 class="text-white text-2xl font-semibold mb-2">Start a meeting</h1>
    <p class="text-white/60 text-sm mb-8">Peer-to-peer video, no account needed.</p>

    <button id="btn-create-room" type="button"
      class="w-full flex items-center justify-center gap-2 rounded-full bg-white text-black h-12 font-semibold hover:bg-white/90 active:scale-95 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60">
      New meeting
    </button>

    <div class="flex items-center gap-3 my-6" aria-hidden="true">
      <div class="h-px flex-1 bg-white/10"></div>
      <span class="text-white/40 text-xs">or</span>
      <div class="h-px flex-1 bg-white/10"></div>
    </div>

    <form id="form-join-room" class="flex items-center gap-2">
      <label for="input-room-id" class="sr-only">4-digit meeting code</label>
      <input id="input-room-id" name="roomId" type="text" inputmode="text" maxlength="4" autocomplete="off"
        placeholder="Enter code"
        class="flex-1 rounded-full bg-white/10 border border-white/10 text-white placeholder-white/40 text-sm px-4 h-12 tracking-widest text-center uppercase focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60" />
      <button type="submit" aria-label="Join meeting"
        class="flex items-center justify-center w-12 h-12 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>
        </svg>
      </button>
    </form>

    <p id="landing-error" class="text-red-400 text-sm mt-4 hidden" role="alert"></p>
  </div>
</main>

<!-- ============================================================ -->
<!-- WAITING VIEW — waiting for the second peer to join            -->
<!-- ============================================================ -->
<main id="view-waiting" class="relative h-screen w-full overflow-hidden bg-black flex items-center justify-center px-4 hidden">
  <div class="absolute inset-0 z-0" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-black"></div>
    <div class="absolute top-0 left-0 w-96 h-96 bg-indigo-500/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative z-10 w-full max-w-sm text-center">
    <div class="w-16 h-16 mx-auto mb-6 rounded-full border-2 border-white/20 border-t-white animate-spin" aria-hidden="true"></div>
    <h1 class="text-white text-xl font-semibold mb-2">Waiting for someone to join&hellip;</h1>
    <p class="text-white/60 text-sm mb-1">Share this link:</p>
    <div class="flex items-center justify-center gap-2 mb-6">
      <code id="room-link" class="text-white text-sm bg-white/10 rounded-full px-4 py-2 select-all"></code>
      <button id="btn-copy-link" type="button" aria-label="Copy link"
        class="flex items-center justify-center w-9 h-9 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 transition-all duration-200">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <p class="text-white/40 text-xs" role="status">
      Discarding in <span id="waiting-countdown" class="tabular-nums">5</span>s if no one joins
    </p>
    <video id="local-preview" class="mt-6 w-40 h-28 mx-auto rounded-2xl object-cover ring-1 ring-white/15" autoplay muted playsinline></video>
  </div>
</main>

<!-- ============================================================ -->
<!-- DISCARDED / ERROR VIEW                                         -->
<!-- ============================================================ -->
<main id="view-ended" class="relative h-screen w-full overflow-hidden bg-black flex items-center justify-center px-4 hidden">
  <div class="relative z-10 w-full max-w-sm text-center">
    <h1 id="ended-title" class="text-white text-xl font-semibold mb-2">Session ended</h1>
    <p id="ended-message" class="text-white/60 text-sm mb-8">No one joined in time.</p>
    <a href="/" class="inline-flex items-center justify-center gap-2 rounded-full bg-white text-black h-12 px-6 font-semibold hover:bg-white/90 active:scale-95 transition-all duration-200">
      Start a new meeting
    </a>
  </div>
</main>

<!-- ============================================================ -->
<!-- CALL VIEW — active 1:1 call, focus mode                        -->
<!-- ============================================================ -->
<main id="view-call" class="relative h-screen w-full overflow-hidden bg-black hidden">

  <video id="remote-video" class="absolute inset-0 w-full h-full object-cover z-0 bg-slate-900" autoplay playsinline></video>
  <div class="absolute inset-0 z-0 bg-gradient-to-t from-black/70 via-transparent to-black/30 pointer-events-none" aria-hidden="true"></div>

  <div class="absolute bottom-28 left-4 sm:left-8 z-10 flex items-center gap-2 rounded-full bg-black/50 backdrop-blur-xl px-4 py-2 shadow-lg">
    <span class="w-2 h-2 rounded-full bg-white/80" aria-hidden="true"></span>
    <span class="text-white text-sm font-medium">Peer</span>
  </div>

  <header class="absolute top-0 inset-x-0 z-20 flex items-center justify-between px-4 sm:px-8 py-4 sm:py-6">
    <div class="flex items-center gap-2 rounded-full bg-black/40 backdrop-blur-xl border border-white/10 px-4 py-2 shadow-lg">
      <span class="relative flex w-2 h-2" aria-hidden="true">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-500 opacity-75"></span>
        <span class="relative inline-flex rounded-full w-2 h-2 bg-red-500"></span>
      </span>
      <span id="call-duration" class="text-white text-sm font-semibold tabular-nums" aria-label="Call duration">00:00</span>
    </div>

    <div class="flex items-center gap-2 rounded-full bg-black/40 backdrop-blur-xl border border-white/10 px-4 py-2 shadow-lg">
      <span id="call-room-code" class="text-white text-sm font-medium tracking-widest uppercase"></span>
    </div>
  </header>

  <div
    class="absolute z-30 top-20 right-4 sm:top-24 sm:right-8 w-28 h-40 sm:w-40 sm:h-56 rounded-2xl overflow-hidden shadow-2xl ring-2 ring-white/20 -rotate-1 transition-transform duration-200 hover:rotate-0 hover:scale-[1.02]"
    role="img" aria-label="Your camera preview">
    <video id="local-video" class="absolute inset-0 w-full h-full object-cover bg-slate-800" autoplay muted playsinline></video>
    <div class="absolute bottom-2 left-2 rounded-full bg-black/50 px-2 py-2">
      <span class="text-white text-xs font-medium">You</span>
    </div>
  </div>

  <div class="absolute bottom-0 inset-x-0 z-20 flex justify-center px-4 pb-6 sm:pb-8">
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 rounded-3xl sm:rounded-full bg-white/10 backdrop-blur-2xl border border-white/10 px-4 sm:px-6 py-4 shadow-2xl max-w-full">

      <button id="btn-toggle-mic" type="button" aria-label="Mute microphone" aria-pressed="false"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60 transition-all duration-200">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>

      <button id="btn-toggle-camera" type="button" aria-label="Turn off camera" aria-pressed="false"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60 transition-all duration-200">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="14" height="12" rx="3"></rect>
          <path d="M16 10l6-4v12l-6-4"></path>
        </svg>
      </button>

      <button id="btn-end-call" type="button" aria-label="End call"
        class="flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-red-500 text-white hover:bg-red-400 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-300 shadow-lg transition-all duration-200">
        <svg class="w-6 h-6 -rotate-45" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"></path>
        </svg>
      </button>

    </div>
  </div>

</main>

</body>
</html>
