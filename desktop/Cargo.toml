[package]
name = "meet"
version = "1.0.0"
description = "Meet: peer-to-peer video calls for two"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
cpal = "0.18"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
nokhwa = { version = "0.10", features = ["input-native"] }
openh264 = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sonora = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
opus = { package = "unsafe-libopus", version = "0.2" }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
wasm-audio = { path = "../frontend/wasm-audio" }
webrtc = "0.17"
xcap = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
