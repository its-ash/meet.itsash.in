<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet — Live Call</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black font-sans antialiased">

<!-- ============================================================ -->
<!-- PRIMARY VIEW — active 1:1 call, focus mode                   -->
<!-- ============================================================ -->
<main class="relative h-screen w-full overflow-hidden bg-black">

  <!-- Remote participant full-bleed video tile (CSS-only placeholder) -->
  <div class="absolute inset-0 z-0" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-indigo-950 to-black"></div>
    <div class="absolute top-0 left-0 w-96 h-96 bg-indigo-500/30 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl"></div>
    <div class="absolute top-40 right-20 w-64 h-64 bg-blue-400/20 rounded-full blur-3xl"></div>
    <div class="absolute left-1/2 bottom-0 w-80 h-80 -translate-x-1/2 rounded-full blur-2xl bg-gradient-to-t from-slate-600/50 to-transparent"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-black/30"></div>
  </div>

  <!-- Remote participant caption -->
  <div class="absolute bottom-28 left-4 sm:left-8 z-10 flex items-center gap-2 rounded-full bg-black/50 backdrop-blur-xl px-4 py-2 shadow-lg">
    <span class="w-2 h-2 rounded-full bg-white/80" aria-hidden="true"></span>
    <span class="text-white text-sm font-medium">Sarah Chen</span>
  </div>

  <!-- Top bar: duration + participants -->
  <header class="absolute top-0 inset-x-0 z-20 flex items-center justify-between px-4 sm:px-8 py-4 sm:py-6">
    <div class="flex items-center gap-2 rounded-full bg-black/40 backdrop-blur-xl border border-white/10 px-4 py-2 shadow-lg">
      <span class="relative flex w-2 h-2" aria-hidden="true">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-500 opacity-75"></span>
        <span class="relative inline-flex rounded-full w-2 h-2 bg-red-500"></span>
      </span>
      <span class="text-white text-sm font-semibold tabular-nums" aria-label="Call duration 18 minutes 42 seconds">18:42</span>
    </div>

    <div class="flex items-center gap-2 rounded-full bg-black/40 backdrop-blur-xl border border-white/10 px-4 py-2 shadow-lg">
      <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M3 20c0-3.2 2.7-6 6-6s6 2.8 6 6"></path>
        <circle cx="17" cy="8" r="2.4"></circle>
        <path d="M15.5 14.2c2.6.5 4.5 2.8 4.5 5.8"></path>
      </svg>
      <span class="text-white text-sm font-medium">You &amp; Sarah Chen</span>
    </div>
  </header>

  <!-- Local self-view — floating PiP tile -->
  <div
    class="absolute z-30 top-20 right-4 sm:top-24 sm:right-8 w-28 h-40 sm:w-40 sm:h-56 rounded-2xl overflow-hidden shadow-2xl ring-2 ring-white/20 -rotate-1 cursor-grab active:cursor-grabbing transition-transform duration-200 hover:rotate-0 hover:scale-[1.02]"
    role="img"
    aria-label="Your camera preview"
  >
    <div class="absolute inset-0 bg-gradient-to-br from-slate-700 via-slate-800 to-black" aria-hidden="true"></div>
    <div class="absolute -top-8 -right-8 w-32 h-32 bg-teal-400/20 rounded-full blur-3xl" aria-hidden="true"></div>
    <div class="absolute left-1/2 bottom-0 w-24 h-24 -translate-x-1/2 rounded-full blur-2xl bg-gradient-to-t from-slate-500/60 to-transparent" aria-hidden="true"></div>

    <!-- drag handle -->
    <div class="absolute top-2 left-2 rounded-full bg-black/40 p-2" aria-hidden="true">
      <svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="8" cy="6" r="1.4"></circle><circle cx="16" cy="6" r="1.4"></circle>
        <circle cx="8" cy="12" r="1.4"></circle><circle cx="16" cy="12" r="1.4"></circle>
        <circle cx="8" cy="18" r="1.4"></circle><circle cx="16" cy="18" r="1.4"></circle>
      </svg>
    </div>

    <div class="absolute bottom-2 left-2 rounded-full bg-black/50 px-2 py-2">
      <span class="text-white text-xs font-medium">You</span>
    </div>
  </div>

  <!-- Bottom-center floating control bar -->
  <div class="absolute bottom-0 inset-x-0 z-20 flex justify-center px-4 pb-6 sm:pb-8">
    <div class="flex flex-wrap items-center justify-center gap-2 sm:gap-4 rounded-3xl sm:rounded-full bg-white/10 backdrop-blur-2xl border border-white/10 px-4 sm:px-6 py-4 shadow-2xl max-w-full">

      <button type="button" aria-label="Mute microphone" aria-pressed="false"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60 transition-all duration-200">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>

      <button type="button" aria-label="Turn off camera" aria-pressed="false"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60 transition-all duration-200">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="14" height="12" rx="3"></rect>
          <path d="M16 10l6-4v12l-6-4"></path>
        </svg>
      </button>

      <!-- Primary action: share screen -->
      <button type="button" aria-label="Share your screen"
        class="flex items-center gap-2 rounded-full bg-white text-black pl-4 pr-6 h-12 sm:h-14 hover:bg-white/90 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/80 shadow-lg transition-all duration-200 font-semibold">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="13" rx="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
          <path d="M9 10l3-3 3 3"></path>
          <path d="M12 7v6"></path>
        </svg>
        <span class="text-sm">Share screen</span>
      </button>

      <button type="button" aria-label="End call"
        class="flex items-center justify-center w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-red-500 text-white hover:bg-red-400 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-red-300 shadow-lg transition-all duration-200">
        <svg class="w-6 h-6 -rotate-45" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"></path>
        </svg>
      </button>

      <button type="button" aria-label="More options"
        class="flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-white/10 text-white hover:bg-white/20 active:scale-95 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/60 transition-all duration-200">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle>
        </svg>
      </button>

    </div>
  </div>

</main>

<!-- ============================================================ -->
<!-- ALTERNATE STATE (reference only) — active screen share        -->
<!-- This section documents the secondary UI state and is not part -->
<!-- of the primary live call view above.                          -->
<!-- ============================================================ -->
<section aria-label="Alternate state reference: active screen share" class="bg-black">

  <div class="bg-white px-4 sm:px-8 py-8">
    <h2 class="text-black text-xl font-bold">Alternate state — Screen sharing active</h2>
    <p class="text-black text-sm mt-2 max-w-2xl">Reference mock of the same call once the local participant starts sharing their screen. The shared content becomes the dominant tile; both camera feeds collapse into a small strip.</p>
  </div>

  <div class="flex justify-center px-4 sm:px-8 py-16">
    <div class="relative w-full max-w-5xl aspect-video rounded-3xl overflow-hidden shadow-2xl ring-1 ring-white/10 bg-slate-900">

      <!-- shared screen backdrop -->
      <div class="absolute inset-0 bg-gradient-to-br from-slate-800 via-slate-900 to-black" aria-hidden="true"></div>

      <!-- mocked shared window -->
      <div class="absolute inset-6 sm:inset-10 rounded-2xl overflow-hidden bg-white shadow-2xl">
        <div class="h-8 bg-gray-100 flex items-center gap-2 px-4" aria-hidden="true">
          <span class="w-2 h-2 rounded-full bg-red-400"></span>
          <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
          <span class="w-2 h-2 rounded-full bg-green-400"></span>
        </div>
        <div class="p-8 space-y-4" aria-hidden="true">
          <div class="h-6 w-2/5 rounded-md bg-black/10"></div>
          <div class="h-4 w-4/5 rounded-md bg-black/10"></div>
          <div class="h-4 w-3/5 rounded-md bg-black/10"></div>
          <div class="h-32 w-full rounded-xl bg-gradient-to-br from-indigo-100 to-purple-100"></div>
          <div class="h-4 w-2/4 rounded-md bg-black/10"></div>
        </div>
      </div>

      <!-- sharing badge -->
      <div class="absolute top-4 sm:top-6 left-4 sm:left-6 flex items-center gap-2 rounded-full bg-black/60 backdrop-blur-xl px-4 py-2 shadow-lg">
        <span class="relative flex w-2 h-2" aria-hidden="true">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full w-2 h-2 bg-green-400"></span>
        </span>
        <span class="text-white text-sm font-semibold">You are sharing your screen</span>
      </div>

      <!-- collapsed camera strip -->
      <div class="absolute top-4 sm:top-6 right-4 sm:right-6 flex flex-col gap-2">
        <div class="w-24 h-16 rounded-xl overflow-hidden ring-2 ring-white/20 shadow-lg relative" role="img" aria-label="Your camera preview, small">
          <div class="absolute inset-0 bg-gradient-to-br from-slate-700 to-black" aria-hidden="true"></div>
          <span class="absolute bottom-2 left-2 text-white text-xs font-medium">You</span>
        </div>
        <div class="w-24 h-16 rounded-xl overflow-hidden ring-2 ring-white/20 shadow-lg relative" role="img" aria-label="Sarah Chen camera preview, small">
          <div class="absolute inset-0 bg-gradient-to-br from-indigo-900 to-black" aria-hidden="true"></div>
          <span class="absolute bottom-2 left-2 text-white text-xs font-medium">Sarah</span>
        </div>
      </div>

      <!-- mini control bar -->
      <div class="absolute bottom-4 sm:bottom-6 inset-x-0 flex justify-center px-4">
        <div class="flex items-center gap-2 sm:gap-4 rounded-full bg-white/10 backdrop-blur-2xl border border-white/10 px-4 sm:px-6 py-4 shadow-2xl">
          <button type="button" aria-label="Mute microphone" aria-pressed="false"
            class="flex items-center justify-center w-12 h-12 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors duration-200">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </button>
          <button type="button" aria-label="Turn off camera" aria-pressed="false"
            class="flex items-center justify-center w-12 h-12 rounded-full bg-white/10 text-white hover:bg-white/20 transition-colors duration-200">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="6" width="14" height="12" rx="3"></rect>
              <path d="M16 10l6-4v12l-6-4"></path>
            </svg>
          </button>
          <button type="button" aria-label="Stop sharing screen"
            class="flex items-center gap-2 rounded-full border-2 border-red-400 text-white pl-4 pr-6 h-12 hover:bg-red-500/20 transition-colors duration-200 font-semibold">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="13" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="21" x2="12" y2="17"></line>
            </svg>
            <span class="text-sm">Stop sharing</span>
          </button>
          <button type="button" aria-label="End call"
            class="flex items-center justify-center w-14 h-14 rounded-full bg-red-500 text-white hover:bg-red-400 transition-colors duration-200">
            <svg class="w-6 h-6 -rotate-45" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"></path>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
