<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet — Live Call</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black font-sans antialiased">

<!-- ============================================================ -->
<!-- PRIMARY VIEW — active 1:1 call, focus mode                   -->
<!-- ============================================================ -->
<main class="relative h-screen w-full overflow-hidden bg-black">

  <!-- Remote participant full-bleed video tile (CSS-only placeholder) -->
  <div class="absolute inset-0 z-0" aria-hidden="true">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950 via-slate-900 to-black"></div>
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 w-[26rem] h-[26rem] bg-slate-700/10 rounded-full blur-3xl"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black/65 via-transparent to-black/25"></div>
  </div>

  <!-- Remote participant caption -->
  <div class="absolute bottom-16 left-3 sm:left-6 z-10 flex items-center gap-1.5 rounded-md bg-slate-950/85 border border-white/10 px-2.5 py-1.5 shadow-sm">
    <span class="w-1.5 h-1.5 rounded-full bg-white/70" aria-hidden="true"></span>
    <span class="text-white text-xs font-medium leading-none">Sarah Chen</span>
  </div>

  <!-- Top bar: duration + participants -->
  <header class="absolute top-0 inset-x-0 z-20 flex items-center justify-between px-3 sm:px-6 py-3 sm:py-4">
    <div class="flex items-center gap-1.5 rounded-md bg-slate-950/85 backdrop-blur-sm border border-white/10 px-2.5 py-1.5 shadow-sm">
      <span class="relative flex w-1.5 h-1.5" aria-hidden="true">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full w-1.5 h-1.5 bg-cyan-400"></span>
      </span>
      <span class="text-white text-xs font-semibold tabular-nums leading-none" aria-label="Call duration 18 minutes 42 seconds">18:42</span>
    </div>

    <div class="flex items-center gap-1.5 rounded-md bg-slate-950/85 backdrop-blur-sm border border-white/10 px-2.5 py-1.5 shadow-sm">
      <svg class="w-3.5 h-3.5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="3"></circle>
        <path d="M3 20c0-3.2 2.7-6 6-6s6 2.8 6 6"></path>
        <circle cx="17" cy="8" r="2.4"></circle>
        <path d="M15.5 14.2c2.6.5 4.5 2.8 4.5 5.8"></path>
      </svg>
      <span class="text-white text-xs font-medium leading-none">You &amp; Sarah Chen</span>
    </div>
  </header>

  <!-- Local self-view — compact corner tile -->
  <div
    class="absolute z-30 top-14 right-3 sm:top-16 sm:right-6 w-24 h-32 sm:w-32 sm:h-44 rounded-lg overflow-hidden shadow-md ring-1 ring-white/15 cursor-grab active:cursor-grabbing transition-all duration-150 hover:ring-white/30"
    role="img"
    aria-label="Your camera preview"
  >
    <div class="absolute inset-0 bg-gradient-to-b from-slate-800 to-slate-950" aria-hidden="true"></div>

    <!-- drag handle -->
    <div class="absolute top-1.5 left-1.5 rounded bg-black/40 p-1" aria-hidden="true">
      <svg class="w-3 h-3 text-white" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="8" cy="6" r="1.4"></circle><circle cx="16" cy="6" r="1.4"></circle>
        <circle cx="8" cy="12" r="1.4"></circle><circle cx="16" cy="12" r="1.4"></circle>
        <circle cx="8" cy="18" r="1.4"></circle><circle cx="16" cy="18" r="1.4"></circle>
      </svg>
    </div>

    <div class="absolute bottom-1.5 left-1.5 rounded bg-black/50 px-1.5 py-0.5">
      <span class="text-white text-[10px] font-medium leading-none">You</span>
    </div>
  </div>

  <!-- Bottom-center structured toolbar -->
  <div class="absolute bottom-0 inset-x-0 z-20 flex justify-center px-3 pb-4 sm:pb-5">
    <div class="flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 rounded-lg bg-slate-950/90 backdrop-blur-sm border border-white/10 px-2 sm:px-3 py-2 shadow-lg max-w-full">

      <button type="button" aria-label="Mute microphone" aria-pressed="false"
        class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-md bg-white/5 text-white hover:bg-white/10 active:scale-95 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-white/50 transition-all duration-150">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
      </button>

      <button type="button" aria-label="Turn off camera" aria-pressed="false"
        class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-md bg-white/5 text-white hover:bg-white/10 active:scale-95 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-white/50 transition-all duration-150">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="6" width="14" height="12" rx="3"></rect>
          <path d="M16 10l6-4v12l-6-4"></path>
        </svg>
      </button>

      <span class="w-px h-6 bg-white/10 mx-0.5 hidden sm:block" aria-hidden="true"></span>

      <!-- Primary action: share screen -->
      <button type="button" aria-label="Share your screen"
        class="flex items-center gap-1.5 rounded-md bg-cyan-600 text-white pl-3 pr-3.5 h-9 sm:h-10 hover:bg-cyan-500 active:scale-95 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-cyan-300 shadow-sm transition-all duration-150 font-medium">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="4" width="20" height="13" rx="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
          <path d="M9 10l3-3 3 3"></path>
          <path d="M12 7v6"></path>
        </svg>
        <span class="text-xs">Share screen</span>
      </button>

      <span class="w-px h-6 bg-white/10 mx-0.5 hidden sm:block" aria-hidden="true"></span>

      <button type="button" aria-label="More options"
        class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-md bg-white/5 text-white hover:bg-white/10 active:scale-95 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-white/50 transition-all duration-150">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle>
        </svg>
      </button>

      <button type="button" aria-label="End call"
        class="flex items-center justify-center w-11 h-9 sm:w-12 sm:h-10 rounded-md bg-red-500 text-white hover:bg-red-400 active:scale-95 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-red-300 shadow-sm transition-all duration-150 ml-0.5">
        <svg class="w-4 h-4 -rotate-45" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"></path>
        </svg>
      </button>

    </div>
  </div>

</main>

<!-- ============================================================ -->
<!-- ALTERNATE STATE (reference only) — active screen share        -->
<!-- This section documents the secondary UI state and is not part -->
<!-- of the primary live call view above.                          -->
<!-- ============================================================ -->
<section aria-label="Alternate state reference: active screen share" class="bg-black">

  <div class="bg-white px-3 sm:px-6 py-6">
    <h2 class="text-black text-lg font-bold leading-tight">Alternate state — Screen sharing active</h2>
    <p class="text-black text-xs leading-relaxed mt-1 max-w-2xl">Reference mock of the same call once the local participant starts sharing their screen. The shared content becomes the dominant tile; both camera feeds collapse into a small strip.</p>
  </div>

  <div class="flex justify-center px-3 sm:px-6 py-10">
    <div class="relative w-full max-w-5xl aspect-video rounded-xl overflow-hidden shadow-lg ring-1 ring-white/10 bg-slate-900">

      <!-- shared screen backdrop -->
      <div class="absolute inset-0 bg-gradient-to-b from-slate-900 to-black" aria-hidden="true"></div>

      <!-- mocked shared window -->
      <div class="absolute inset-4 sm:inset-8 rounded-lg overflow-hidden bg-white shadow-lg">
        <div class="h-7 bg-gray-100 flex items-center gap-1.5 px-3" aria-hidden="true">
          <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-green-400"></span>
        </div>
        <div class="p-6 space-y-3" aria-hidden="true">
          <div class="h-5 w-2/5 rounded bg-black/10"></div>
          <div class="h-3 w-4/5 rounded bg-black/10"></div>
          <div class="h-3 w-3/5 rounded bg-black/10"></div>
          <div class="h-28 w-full rounded-lg bg-cyan-50"></div>
          <div class="h-3 w-2/4 rounded bg-black/10"></div>
        </div>
      </div>

      <!-- sharing badge -->
      <div class="absolute top-3 sm:top-5 left-3 sm:left-5 flex items-center gap-1.5 rounded-md bg-slate-950/90 border border-white/10 px-2.5 py-1.5 shadow-sm">
        <span class="relative flex w-1.5 h-1.5" aria-hidden="true">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full w-1.5 h-1.5 bg-cyan-400"></span>
        </span>
        <span class="text-white text-xs font-semibold leading-none">You are sharing your screen</span>
      </div>

      <!-- collapsed camera strip -->
      <div class="absolute top-3 sm:top-5 right-3 sm:right-5 flex flex-col gap-1.5">
        <div class="w-20 h-14 rounded-md overflow-hidden ring-1 ring-white/15 shadow-sm relative" role="img" aria-label="Your camera preview, small">
          <div class="absolute inset-0 bg-gradient-to-b from-slate-800 to-slate-950" aria-hidden="true"></div>
          <span class="absolute bottom-1 left-1.5 text-white text-[10px] font-medium leading-none">You</span>
        </div>
        <div class="w-20 h-14 rounded-md overflow-hidden ring-1 ring-white/15 shadow-sm relative" role="img" aria-label="Sarah Chen camera preview, small">
          <div class="absolute inset-0 bg-gradient-to-b from-slate-700 to-slate-950" aria-hidden="true"></div>
          <span class="absolute bottom-1 left-1.5 text-white text-[10px] font-medium leading-none">Sarah</span>
        </div>
      </div>

      <!-- mini control bar -->
      <div class="absolute bottom-3 sm:bottom-5 inset-x-0 flex justify-center px-3">
        <div class="flex items-center gap-1 sm:gap-1.5 rounded-lg bg-slate-950/90 backdrop-blur-sm border border-white/10 px-2 sm:px-3 py-2 shadow-lg">
          <button type="button" aria-label="Mute microphone" aria-pressed="false"
            class="flex items-center justify-center w-9 h-9 rounded-md bg-white/5 text-white hover:bg-white/10 transition-colors duration-150">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="2" width="6" height="12" rx="3"></rect>
              <path d="M5 10a7 7 0 0 0 14 0"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
              <line x1="8" y1="22" x2="16" y2="22"></line>
            </svg>
          </button>
          <button type="button" aria-label="Turn off camera" aria-pressed="false"
            class="flex items-center justify-center w-9 h-9 rounded-md bg-white/5 text-white hover:bg-white/10 transition-colors duration-150">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="6" width="14" height="12" rx="3"></rect>
              <path d="M16 10l6-4v12l-6-4"></path>
            </svg>
          </button>
          <span class="w-px h-6 bg-white/10 mx-0.5 hidden sm:block" aria-hidden="true"></span>
          <button type="button" aria-label="Stop sharing screen"
            class="flex items-center gap-1.5 rounded-md border border-red-400/70 text-white pl-3 pr-3.5 h-9 hover:bg-red-500/15 transition-colors duration-150 font-medium">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="13" rx="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="21" x2="12" y2="17"></line>
            </svg>
            <span class="text-xs">Stop sharing</span>
          </button>
          <span class="w-px h-6 bg-white/10 mx-0.5 hidden sm:block" aria-hidden="true"></span>
          <button type="button" aria-label="End call"
            class="flex items-center justify-center w-11 h-9 rounded-md bg-red-500 text-white hover:bg-red-400 transition-colors duration-150">
            <svg class="w-4 h-4 -rotate-45" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.3 1.1L6.6 10.8z"></path>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>
</section>

</body>
</html>
